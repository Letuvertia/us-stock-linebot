name: Collect yfinance Data

on:
  schedule:
    - cron: '0 7 * * *'    # 15:00 UTC+8 daily
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Write service account credentials
        run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}' > /tmp/gsa.json

      - name: Run yfinance collector
        env:
          DATA_CREDS_FILE: /tmp/gsa.json
          US_STOCK_SPREADSHEET_ID: ${{ secrets.US_STOCK_SPREADSHEET_ID }}
        run: uv run scripts/market_data/collect_yfinance.py
